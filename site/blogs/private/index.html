(function () {
  "use strict";
  var payload = null;
  var encoder = new TextEncoder();
  var decoder = new TextDecoder();

  function bytes(value) {
    var raw = atob(value);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function decryptFile(filenames, password) {
    var parts = await Promise.all(filenames.map(function (filename) {
      return fetch(filename, {cache: "no-store"}).then(function (response) {
        if (!response.ok) throw new Error("Encrypted payload is unavailable.");
        return response.text();
      });
    }));
    var encrypted = JSON.parse(parts.join(""));
    var material = await crypto.subtle.importKey(
      "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    var key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: bytes(encrypted.salt),
        iterations: encrypted.iterations,
        hash: "SHA-256"
      },
      material,
      {name: "AES-GCM", length: 256},
      false,
      ["decrypt"]
    );
    var clear = await crypto.subtle.decrypt(
      {name: "AES-GCM", iv: bytes(encrypted.iv)},
      key,
      bytes(encrypted.ciphertext)
    );
    return JSON.parse(decoder.decode(clear)).article;
  }

  function renderIndex() {
    var index = document.getElementById("private-blog-index");
    var reader = document.getElementById("private-blog-reader");
    index.hidden = false;
    reader.hidden = true;
    index.innerHTML = '<div class="section-head"><span class="label">Private archive</span><h2>Private articles.</h2></div>';
    var list = document.createElement("div");
    list.className = "journal-index";
    payload.articles.forEach(function (article, position) {
      var link = document.createElement("a");
      link.className = "entry";
      link.href = "#" + article.slug;
      var number = document.createElement("span");
      number.textContent = String(position + 4).padStart(3, "0");
      var title = document.createElement("strong");
      title.textContent = article.title;
      var meta = document.createElement("span");
      meta.textContent = "private";
      link.appendChild(number);
      link.appendChild(title);
      link.appendChild(meta);
      list.appendChild(link);
    });
    index.appendChild(list);
    document.title = "Private writing — priyanshchordia.com";
  }

  function renderArticle(slug) {
    var article = payload.articles.find(function (item) { return item.slug === slug; });
    if (!article) {
      renderIndex();
      return;
    }
    document.getElementById("private-blog-index").hidden = true;
    document.getElementById("private-blog-reader").hidden = false;
    document.getElementById("private-blog-meta").textContent =
      [article.date, article.series, "PRIVATE"].filter(Boolean).join(" / ");
    document.getElementById("private-blog-title").textContent = article.title;
    document.getElementById("private-blog-body").innerHTML = article.html;
    document.title = article.title + " — private";
    window.scrollTo({top: 0, behavior: "instant"});
  }

  function renderRoute() {
    if (!payload) return;
    var slug = decodeURIComponent(window.location.hash.replace(/^#/, ""));
    if (slug) renderArticle(slug);
    else renderIndex();
  }

  var form = document.getElementById("private-blog-form");
  var input = document.getElementById("private-blog-password");
  var error = document.getElementById("private-blog-error");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    error.hidden = true;
    try {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error("This browser does not support the Web Crypto API.");
      }
      var files = [
        ["04.json"],
        ["05.json"],
        ["06.1.part", "06.2.part", "06.3.part"],
        ["07.1.part", "07.2.part", "07.3.part"]
      ];
      var articles = await Promise.all(files.map(function (filenames) {
        return decryptFile(filenames, input.value);
      }));
      payload = {articles: articles};
      input.value = "";
      document.getElementById("private-gate").hidden = true;
      document.getElementById("private-vault").hidden = false;
      renderRoute();
    } catch (reason) {
      error.textContent = "Incorrect password or unavailable encrypted payload.";
      error.hidden = false;
    }
  });

  window.addEventListener("hashchange", renderRoute);
}());
</script><script>(function(){var a=["signal","editorial","instrument","gallery","monolith","overworld","unknown-signal","cabinet","parallel","workshop","department"],ss=[].slice.call(document.querySelectorAll('.themer'));if(!ss.length)return;try{var t=localStorage.getItem('pc-theme');if(a.indexOf(t)>=0)ss.forEach(function(s){s.value=t})}catch(e){}ss.forEach(function(s){s.addEventListener('change',function(){var v=s.value;if(a.indexOf(v)<0)return;document.documentElement.setAttribute('data-theme',v);ss.forEach(function(o){o.value=v});try{localStorage.setItem('pc-theme',v)}catch(e){}requestAnimationFrame(function(){var xp=document.documentElement.classList.contains('has-xp');var target=document.querySelector(xp?'#themer2':'#themer');if(target&&target!==document.activeElement)target.focus()})})})})()</script></body></html>
