name: MachineCart scope hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/machinecart-scope-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machinecart-scope-hotfix
  cancel-in-progress: false

jobs:
  remove-excluded-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Primandir analytics dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/sync_machinecart.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "adds consent-gated analytics, and validates the mounted",
              "adds a no-network analytics shim, and validates the mounted",
              1,
          )

          old_constant = 'HUBSPOT_PORTAL_ID = "246481057"'
          if old_constant not in text:
              raise SystemExit("Expected HubSpot portal constant was not found")
          text = text.replace(old_constant, 'ANALYTICS_MODE = "disabled"', 1)

          analytics_pattern = re.compile(
              r"def analytics_javascript\(\) -> str:\n.*?\n\n\ndef og_card_svg\(\) -> str:",
              flags=re.DOTALL,
          )
          analytics_replacement = '''def analytics_javascript() -> str:
              """Return a no-network compatibility shim.

              MachineCart intentionally sends no analytics to Primandir or any other
              third-party property. Existing pages may call ``machineCartTrack``;
              the no-op keeps those calls safe without collecting or transmitting data.
              """
              return """(() => {
            "use strict";
            window.machineCartTrack = function () {};
          })();
          """


          def og_card_svg() -> str:'''
          text, analytics_count = analytics_pattern.subn(
              lambda _match: analytics_replacement,
              text,
              count=1,
          )
          if analytics_count != 1:
              raise SystemExit(f"Expected one analytics function, replaced {analytics_count}")

          privacy_pattern = re.compile(
              r"def privacy_rewrite\(path: Path\) -> None:\n.*?\n\n\ndef resolve_local\(",
              flags=re.DOTALL,
          )
          privacy_replacement = '''def privacy_rewrite(path: Path) -> None:
              content = path.read_text(encoding="utf-8")
              replacement = (
                  "<section><h2>Analytics</h2><p>MachineCart currently does not load "
                  "third-party analytics, advertising trackers, or cross-site measurement. "
                  "The scanner runs in your browser. If a separate opt-in analytics property "
                  "is added later, this notice will be updated before collection begins.</p></section>"
              )
              content, count = re.subn(
                  r"<section><h2>(?:Optional analytics|Analytics)</h2>.*?</section>",
                  replacement,
                  content,
                  count=1,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              if count != 1:
                  raise ValueError("privacy.html analytics section was not found")
              content = content.replace("Last updated August 23, 2026.", "Last updated August 24, 2026.")
              path.write_text(content, encoding="utf-8")


          def resolve_local('''
          text, privacy_count = privacy_pattern.subn(
              lambda _match: privacy_replacement,
              text,
              count=1,
          )
          if privacy_count != 1:
              raise SystemExit(f"Expected one privacy rewrite function, replaced {privacy_count}")

          deployment_pattern = re.compile(
              r'"analytics": \{\n\s+"provider": "HubSpot",\n\s+"portal_id": HUBSPOT_PORTAL_ID,\n\s+"consent_required": True,\n\s+\},'
          )
          deployment_replacement = '''"analytics": {
                      "provider": "None",
                      "mode": ANALYTICS_MODE,
                      "consent_required": False,
                      "network_requests": False,
                  },'''
          text, deployment_count = deployment_pattern.subn(
              lambda _match: deployment_replacement,
              text,
              count=1,
          )
          if deployment_count != 1:
              raise SystemExit(f"Expected one deployment analytics block, replaced {deployment_count}")

          if "246481057" in text or "js.hs-scripts.com" in text or '"provider": "HubSpot"' in text:
              raise SystemExit("Excluded HubSpot reference remains after patch")

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile scripts/sync_machinecart.py
          grep -q 'ANALYTICS_MODE = "disabled"' scripts/sync_machinecart.py
          ! grep -q '246481057\|js.hs-scripts.com\|"provider": "HubSpot"' scripts/sync_machinecart.py

      - name: Commit the verified hotfix
        shell: bash
        run: |
          git config user.name "machinecart-scope-guard[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add scripts/sync_machinecart.py
          if git diff --cached --quiet; then
            echo "Scope hotfix is already applied."
            exit 0
          fi
          git commit -m "Remove excluded Primandir analytics from MachineCart"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
