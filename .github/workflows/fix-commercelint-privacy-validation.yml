name: Fix CommerceLint privacy validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-commercelint-privacy-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-commercelint-privacy-validation
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make privacy validation semantic and remove retired callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_commercelint.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace("  window.machineCartTrack = noOp;\n", "", 1)

          old = '''    privacy = (target / "privacy.html").read_text(encoding="utf-8") if (target / "privacy.html").exists() else ""
              if "does not load third-party analytics" not in privacy:
                  errors.append("privacy.html: no-network analytics disclosure is missing")'''
          new = '''    privacy = (target / "privacy.html").read_text(encoding="utf-8") if (target / "privacy.html").exists() else ""
              privacy_lower = privacy.lower()
              has_tracker_disclosure = (
                  "third-party analytics" in privacy_lower
                  and ("advertising tracker" in privacy_lower or "advertising trackers" in privacy_lower)
              )
              has_no_network_disclosure = any(
                  marker in privacy_lower
                  for marker in ("no network events", "sends no page or scanner data", "no-network")
              )
              if not (has_tracker_disclosure and has_no_network_disclosure):
                  errors.append("privacy.html: no-network analytics disclosure is missing")'''

          if old not in text:
              raise SystemExit("Expected privacy validation block was not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile scripts/sync_commercelint.py
          grep -q "has_no_network_disclosure" scripts/sync_commercelint.py
          ! grep -q "window.machineCartTrack" scripts/sync_commercelint.py

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "commercelint-deployment[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add scripts/sync_commercelint.py
          if git diff --cached --quiet; then
            echo "Privacy validation is already current."
            exit 0
          fi
          git commit -m "Harden CommerceLint privacy validation"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          path = Path("scripts/sync_commercelint.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("  window.machineCartTrack = noOp;\n", "", 1)
          old = '''    privacy = (target / "privacy.html").read_text(encoding="utf-8") if (target / "privacy.html").exists() else ""
              if "does not load third-party analytics" not in privacy:
                  errors.append("privacy.html: no-network analytics disclosure is missing")'''
          new = '''    privacy = (target / "privacy.html").read_text(encoding="utf-8") if (target / "privacy.html").exists() else ""
              privacy_lower = privacy.lower()
              has_tracker_disclosure = (
                  "third-party analytics" in privacy_lower
                  and ("advertising tracker" in privacy_lower or "advertising trackers" in privacy_lower)
              )
              has_no_network_disclosure = any(
                  marker in privacy_lower
                  for marker in ("no network events", "sends no page or scanner data", "no-network")
              )
              if not (has_tracker_disclosure and has_no_network_disclosure):
                  errors.append("privacy.html: no-network analytics disclosure is missing")'''
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
            git add scripts/sync_commercelint.py
            git commit -m "Harden CommerceLint privacy validation" || true
            sleep $((attempt * 3))
          done
          exit 1
