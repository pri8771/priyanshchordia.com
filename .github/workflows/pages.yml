name: Deploy public portfolio

on:
  push:
    branches: [main]
    paths-ignore:
      - "deployments/**"
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      machinecart_source_sha: ${{ steps.machinecart_source.outputs.sha }}
      machinecart_source_changed: ${{ steps.machinecart_changed.outputs.changed }}
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4

      - name: Check out autonomous MachineCart source
        uses: actions/checkout@v4
        with:
          repository: pri8771/autonomous_apps
          ref: main
          path: .machinecart-source

      - name: Record MachineCart source revision
        id: machinecart_source
        shell: bash
        run: echo "sha=$(git -C .machinecart-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect a new MachineCart release
        id: machinecart_changed
        env:
          CURRENT_SHA: ${{ steps.machinecart_source.outputs.sha }}
        shell: bash
        run: |
          previous="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('deployments/machinecart-production.json')
          if not path.exists():
              print('')
          else:
              try:
                  print(json.loads(path.read_text(encoding='utf-8')).get('machinecart_source_commit', ''))
              except Exception:
                  print('')
          PY
          )"
          if [ "$previous" = "$CURRENT_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous MachineCart source: ${previous:-none}"
          echo "Current MachineCart source: $CURRENT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test generator and interactive map invariants
        run: python3 -m unittest discover -s tests -v

      - name: Generate static portfolio
        run: python3 scripts/generate_site.py

      - name: Validate generated portfolio routes and markup
        run: python3 scripts/check_site.py

      - name: Check generated portfolio JavaScript
        run: |
          node --check site/experiences.js
          node --check site/app-themes.js

      - name: Verify committed portfolio output is current
        run: test -z "$(git status --porcelain --untracked-files=all -- site)"

      - name: Mount and validate latest MachineCart release
        run: python3 scripts/sync_machinecart.py .machinecart-source/docs site/machinecart

      - name: Check MachineCart analytics JavaScript
        run: node --check site/machinecart/assets/analytics.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_production:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    timeout-minutes: 10
    outputs:
      indexnow_outcome: ${{ steps.indexnow.outcome }}
      indexnow_status: ${{ steps.indexnow.outputs.status }}
      indexnow_url_count: ${{ steps.indexnow.outputs.url_count }}
    steps:
      - name: Verify public MachineCart funnel
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp)"
          scanner="$(mktemp)"
          status="$(mktemp)"
          success=false
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 20 "https://priyanshchordia.com/machinecart/" -o "$home" \
              && curl -fsSL --max-time 20 "https://priyanshchordia.com/machinecart/scanner.html" -o "$scanner" \
              && curl -fsSL --max-time 20 "https://priyanshchordia.com/machinecart/status.json" -o "$status" \
              && curl -fsSL --max-time 20 "https://priyanshchordia.com/machinecart/1d88808c1ec138f77fe50484f83e6de7.txt" | grep -q "1d88808c1ec138f77fe50484f83e6de7" \
              && grep -q "MachineCart" "$home" \
              && grep -q "analyzeMarkup" "$scanner" \
              && python -m json.tool "$status" >/dev/null; then
              success=true
              break
            fi
            echo "Production verification attempt $attempt did not pass yet."
            sleep 12
          done
          test "$success" = true
          echo "MachineCart production funnel is reachable and structurally healthy."

      - name: Submit changed MachineCart URLs to IndexNow
        id: indexnow
        if: ${{ needs.build.outputs.machinecart_source_changed == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import xml.etree.ElementTree as ET

          base = "https://priyanshchordia.com/machinecart/"
          sitemap_url = base + "sitemap.xml"
          key = "1d88808c1ec138f77fe50484f83e6de7"
          key_location = base + key + ".txt"
          with urllib.request.urlopen(sitemap_url, timeout=30) as response:
              root = ET.fromstring(response.read())
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in root.findall("sm:url/sm:loc", namespace) if node.text]
          urls = sorted({url for url in urls if url.startswith(base)})
          if not urls:
              raise SystemExit("Production sitemap contained no MachineCart URLs")
          payload = json.dumps({
              "host": "priyanshchordia.com",
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8", "User-Agent": "MachineCart-Discovery/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              status = int(response.status)
              response.read(512)
          if status not in {200, 202}:
              raise SystemExit(f"IndexNow returned HTTP {status}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"url_count={len(urls)}\n")
          print(f"IndexNow accepted {len(urls)} production URLs with HTTP {status}.")
          PY

      - name: Open or refresh search-discovery incident
        if: ${{ needs.build.outputs.machinecart_source_changed == 'true' && steps.indexnow.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] Search discovery incident"
          body="The production site deployed successfully, but IndexNow submission failed in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The next changed release will retry automatically."
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Resolve search-discovery incident
        if: ${{ needs.build.outputs.machinecart_source_changed == 'true' && steps.indexnow.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] Search discovery incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "IndexNow accepted the latest verified release. Closing automatically."
            gh issue close "$existing" --reason completed
          fi

  record_success:
    runs-on: ubuntu-latest
    needs: [build, deploy, verify_production]
    if: ${{ success() }}
    steps:
      - name: Check out deployment ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write machine-readable deployment receipt
        env:
          MACHINECART_SOURCE_SHA: ${{ needs.build.outputs.machinecart_source_sha }}
          MACHINECART_SOURCE_CHANGED: ${{ needs.build.outputs.machinecart_source_changed }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          INDEXNOW_OUTCOME: ${{ needs.verify_production.outputs.indexnow_outcome }}
          INDEXNOW_STATUS: ${{ needs.verify_production.outputs.indexnow_status }}
          INDEXNOW_URL_COUNT: ${{ needs.verify_production.outputs.indexnow_url_count }}
          WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "status": "live",
              "verified_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "machinecart_url": "https://priyanshchordia.com/machinecart/",
              "scanner_url": "https://priyanshchordia.com/machinecart/scanner.html",
              "portfolio_commit": os.environ["GITHUB_SHA"],
              "machinecart_source_commit": os.environ["MACHINECART_SOURCE_SHA"],
              "machinecart_source_changed": os.environ.get("MACHINECART_SOURCE_CHANGED") == "true",
              "pages_url": os.environ.get("PAGE_URL", ""),
              "workflow_run_url": os.environ["WORKFLOW_RUN_URL"],
              "indexnow": {
                  "outcome": os.environ.get("INDEXNOW_OUTCOME", "skipped") or "skipped",
                  "http_status": os.environ.get("INDEXNOW_STATUS", ""),
                  "url_count": int(os.environ.get("INDEXNOW_URL_COUNT") or 0),
              },
              "checks": [
                  "home returned HTTP success and contained MachineCart",
                  "scanner returned HTTP success and contained analyzeMarkup",
                  "status.json returned valid JSON",
                  "IndexNow ownership key was publicly reachable",
              ],
          }
          path = Path("deployments/machinecart-production.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit deployment receipt
        shell: bash
        run: |
          git config user.name "machinecart-deployment[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add deployments/machinecart-production.json
          if git diff --cached --quiet; then
            echo "Deployment receipt is already current."
          else
            git commit -m "Record verified MachineCart production deployment"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git pull --rebase origin main
              sleep $((attempt * 3))
            done
            exit 1
          fi

      - name: Resolve prior deployment incident
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[MachineCart] Production deployment incident"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Production deployment and HTTP verification succeeded in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Closing automatically."
            gh issue close "$existing" --reason completed
          fi

  report_failure:
    runs-on: ubuntu-latest
    needs: [build, deploy, verify_production]
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify_production.result == 'failure') }}
    steps:
      - name: Open or refresh deployment incident
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify_production.result }}
        shell: bash
        run: |
          title="[MachineCart] Production deployment incident"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="MachineCart production did not pass its deployment gate. Build: ${BUILD_RESULT}; deploy: ${DEPLOY_RESULT}; public verification: ${VERIFY_RESULT}. Run: ${run_url}"
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
