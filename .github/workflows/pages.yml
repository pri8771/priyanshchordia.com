name: Deploy public portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test generator and interactive map invariants
        run: python3 -m unittest discover -s tests -v
      - name: Generate static site
        run: python3 scripts/generate_site.py
      - name: Validate generated routes and markup
        run: python3 scripts/check_site.py
      - name: Check generated experience JavaScript
        run: node --check site/experiences.js
      - name: Verify committed output is current
        run: test -z "$(git status --porcelain --untracked-files=all -- site)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
