name: Repair MachineCart workflow repository context

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-machinecart-gh-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add explicit repository context for GitHub CLI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          marker = "permissions:\n  contents: write\n  pages: write\n  id-token: write\n  issues: write\n\n"
          replacement = marker + "env:\n  GH_REPO: ${{ github.repository }}\n\n"
          if replacement in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one workflow permissions marker; found {text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          grep -A7 '^permissions:' .github/workflows/pages.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "machinecart-maintenance[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add .github/workflows/pages.yml
          if git diff --cached --quiet; then
            echo "Repository context already present."
            exit 0
          fi
          git commit -m "Fix MachineCart workflow GitHub CLI context"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
