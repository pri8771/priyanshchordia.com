name: Add MachineCart portfolio promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/portfolio-machinecart-promotion-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add a durable portfolio-home promotion during production sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync_machinecart.py')
          text = path.read_text(encoding='utf-8')

          function_marker = 'def inject_portfolio_promotion(site_root: Path) -> None:'
          if function_marker not in text:
              insertion_marker = '\ndef merge_discovery(site_root: Path, machinecart_root: Path) -> None:\n'
              if text.count(insertion_marker) != 1:
                  raise SystemExit(f'Expected one merge_discovery marker; found {text.count(insertion_marker)}')
              function = r'''

def inject_portfolio_promotion(site_root: Path) -> None:
    """Add one tracked MachineCart launch surface without changing app data."""

    homepage = site_root / "index.html"
    content = homepage.read_text(encoding="utf-8")
    marker = 'id="machinecart-live"'
    if marker in content:
        return

    journal_marker = '<section id="journal">'
    if content.count(journal_marker) != 1:
        raise ValueError(
            f"Expected one portfolio journal section, found {content.count(journal_marker)}"
        )

    promotion = """<section id="machinecart-live" data-machinecart-promotion="2026-08-24">
<div class="section-head"><span class="label">02 / Live experiment</span><h2>Machine-readable commerce.</h2></div>
<div class="products"><a class="product" href="machinecart/?utm_source=portfolio&amp;utm_medium=internal&amp;utm_campaign=machinecart_launch">
<span class="num">LIVE</span><h3>MachineCart</h3>
<p>Scan an ecommerce product page for structured-data, offer, variant, policy, and machine-understanding gaps.</p>
<span class="meta">web commerce / free scanner</span></a></div>
</section>
"""
    content = content.replace(journal_marker, promotion + journal_marker, 1)
    content = content.replace(
        '<span class="label">02 / Journal</span>',
        '<span class="label">03 / Journal</span>',
        1,
    )

    nav_marker = '<a href="journal/">Journal</a>'
    nav_link = (
        '<a href="machinecart/?utm_source=portfolio_nav&amp;utm_medium=internal&amp;'
        'utm_campaign=machinecart_launch">MachineCart</a>'
    )
    if nav_link not in content:
        if content.count(nav_marker) != 1:
            raise ValueError(
                f"Expected one portfolio journal nav link, found {content.count(nav_marker)}"
            )
        content = content.replace(nav_marker, nav_link + nav_marker, 1)

    homepage.write_text(content, encoding="utf-8")

    rendered = homepage.read_text(encoding="utf-8")
    required = (
        marker,
        'href="machinecart/?utm_source=portfolio',
        '>MachineCart</a>',
        '03 / Journal',
    )
    missing = [value for value in required if value not in rendered]
    if missing:
        raise ValueError(f"Portfolio MachineCart promotion failed validation: {missing}")
'''
              text = text.replace(insertion_marker, function + insertion_marker, 1)

          call_marker = '    merge_discovery(site_root, target)\n\n    errors = validate(target)'
          replacement = '    merge_discovery(site_root, target)\n    inject_portfolio_promotion(site_root)\n\n    errors = validate(target)'
          if replacement not in text:
              if text.count(call_marker) != 1:
                  raise SystemExit(f'Expected one production call marker; found {text.count(call_marker)}')
              text = text.replace(call_marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched sync script
        run: |
          python -m py_compile scripts/sync_machinecart.py
          grep -q 'def inject_portfolio_promotion' scripts/sync_machinecart.py
          grep -q 'inject_portfolio_promotion(site_root)' scripts/sync_machinecart.py

      - name: Commit portfolio promotion
        shell: bash
        run: |
          git config user.name "machinecart-growth[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add scripts/sync_machinecart.py
          if git diff --cached --quiet; then
            echo "Portfolio promotion already applied."
            exit 0
          fi
          git commit -m "Promote MachineCart from the portfolio homepage"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
