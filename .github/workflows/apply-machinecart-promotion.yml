name: Apply MachineCart portfolio promotion integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-machinecart-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect promotion module to production sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/sync_machinecart.py")
          text = path.read_text(encoding="utf-8")

          import_line = "from machinecart_portfolio_promotion import inject_portfolio_promotion\n"
          import_marker = "from urllib.parse import unquote, urlsplit\n"
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("Could not locate the sync import marker")
              text = text.replace(import_marker, import_marker + import_line, 1)

          call_line = "    inject_portfolio_promotion(site_root)\n"
          call_marker = "    merge_discovery(site_root, target)\n"
          if call_line not in text:
              if text.count(call_marker) != 1:
                  raise SystemExit("Could not locate the discovery merge call")
              text = text.replace(call_marker, call_marker + call_line, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate integration
        run: |
          python -m py_compile scripts/sync_machinecart.py scripts/machinecart_portfolio_promotion.py
          grep -q "from machinecart_portfolio_promotion import inject_portfolio_promotion" scripts/sync_machinecart.py
          grep -q "inject_portfolio_promotion(site_root)" scripts/sync_machinecart.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "machinecart-growth[bot]"
          git config user.email "pchordia@unsubscriber.me"
          git add scripts/sync_machinecart.py
          if git diff --cached --quiet; then
            echo "Portfolio promotion integration is already applied."
            exit 0
          fi
          git commit -m "Promote MachineCart from the portfolio homepage"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1
